# CI 草案（Windows）
#
# ⚠️ 未在真实 CI 上验证，需人工。
#    - 首次推送后请人工检查 Actions 日志与产物；Godot 下载地址/版本若变更，需要同步更新。
#    - headless 无渲染，所以这里不跑截图；"可启动性"由本地 scripts/selfcheck.ps1 的 GUI 冒烟负责。
#    - `--editor --quit` 不会编译"运行时才 load()"的脚本（曾漏掉 lab_binary.gd 语法错误），
#      因此 CI 的导入检查不能替代本地冒烟（见 docs/PROGRESS.md 偏差 9/10）。
#    - native/ 不在本流水线构建（M1 未编译，见 docs/adr/0002-native-boundary.md）。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 显式告诉脚本引擎在哪：与下面「安装 Godot」步骤的落点保持一致。
      GODOT_BIN: C:\tools\godot-4.4.1\godot.cmd

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Godot 4.4.1 到 C:\tools\godot-4.4.1
        shell: powershell
        run: |
          # Keep this script ASCII-only: Windows PowerShell 5 misreads UTF-8 scripts without BOM.
          # Every sub-step has a checkpoint; failures go through Fail() and emit
          # ::error::<which step + what error> instead of a bare .github:41 annotation.
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $version = "4.4.1"
          $url = "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_win64.exe.zip"
          $dest = "C:\tools\godot-$version"
          $log = Join-Path $env:RUNNER_TEMP "install-godot.log"
          New-Item -ItemType File -Force -Path $log | Out-Null

          function Write-Step([string]$m) {
            $line = "[$(Get-Date -Format 'HH:mm:ss')] $m"
            Write-Host $line
            Add-Content -Path $log -Value $line
          }
          $script:step = "init"
          function Fail([string]$detail) {
            Write-Step "FAIL @ $script:step :: $detail"
            Write-Host "::error::Godot install failed @ $script:step :: $detail"
            exit 1
          }

          Write-Host "::group::Install Godot $version"
          try {
            # ---- 1/6 create dir ----
            $script:step = "create-dir"
            Write-Step "checkpoint 1/6: create $dest"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            if (-not (Test-Path $dest)) { Fail "directory not created: $dest" }

            # ---- 2/6 download (choco fallback only on failure) ----
            $zip = Join-Path $env:RUNNER_TEMP "godot.zip"
            $exe = $null
            $downloaded = $false
            $script:step = "download"
            Write-Step "checkpoint 2/6: download $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $size = (Get-Item $zip).Length
              Write-Step "downloaded zip: $zip ($size B)"
              if ($size -lt 30MB) { throw "file too small ($size B), truncated or an error page" }
              $downloaded = $true
            } catch {
              Write-Step "direct download failed: $($_.Exception.Message)"
              Write-Step "FALLBACK: using 'choco install godot --version=$version' (only when direct download fails)"
              $script:step = "fallback-choco"
              choco install godot --version=$version -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "choco exited with code $LASTEXITCODE" }
              $shim = Get-ChildItem "C:\ProgramData\chocolatey\bin" -Filter "godot*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $shim) {
                $shim = Get-ChildItem "C:\ProgramData\chocolatey\lib\godot" -Recurse -Filter "Godot*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              }
              if (-not $shim) { throw "fallback install finished but no godot exe found" }
              $exe = $shim.FullName
              Write-Step "fallback ok, exe: $exe"
            }

            # ---- 3/6 + 4/6 expand and verify (direct-download path only) ----
            if ($downloaded) {
              $script:step = "expand"
              Write-Step "checkpoint 3/6: Expand-Archive -> $dest"
              Expand-Archive -Path $zip -DestinationPath $dest -Force
              $script:step = "verify-exe"
              $exe = Join-Path $dest "Godot_v$version-stable_win64.exe"
              Write-Step "checkpoint 4/6: verify $exe"
              if (-not (Test-Path $exe)) { Fail "exe missing after expand: $exe" }
            }

            # ---- 5/6 write launcher and self-check version ----
            $script:step = "write-launcher"
            $cmd = Join-Path $dest "godot.cmd"
            Write-Step "checkpoint 5/6: write $cmd and run --version"
            Set-Content -Path $cmd -Value "@echo off`r`n`"$exe`" %*" -Encoding ASCII
            $out = (& $cmd --version 2>&1 | Out-String).Trim()
            Write-Step "godot --version output: $out"
            if ($out -notmatch "4\.4\.1") { Fail "unexpected version: $out" }

            # ---- 6/6 write GITHUB_ENV for later steps ----
            $script:step = "write-github-env"
            Write-Step "checkpoint 6/6: write GITHUB_ENV"
            Add-Content -Path $env:GITHUB_ENV -Value "GODOT_BIN=$cmd"
            Write-Step "GITHUB_ENV: $(Get-Content -Raw $env:GITHUB_ENV)"

            Write-Step "done: GODOT_BIN=$cmd"
            Write-Host "::endgroup::"
          } catch {
            Fail "exception: $($_.Exception.GetType().Name): $($_.Exception.Message)"
          }
          exit 0

      - name: 上传安装日志（失败也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-install-log
          path: ${{ runner.temp }}/install-godot.log
          if-no-files-found: warn

      - name: 导入检查（headless --editor --quit）
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path artifacts\logs | Out-Null
          if (-not (Test-Path $env:GODOT_BIN)) { Write-Host "env prep failed: GODOT_BIN points to missing $env:GODOT_BIN"; exit 1 }
          & $env:GODOT_BIN --headless --path "$env:GITHUB_WORKSPACE" --editor --quit *> artifacts\logs\import.log
          $code = $LASTEXITCODE
          Get-Content artifacts\logs\import.log | Select-Object -Last 20
          $text = Get-Content -Raw artifacts\logs\import.log
          if ($code -ne 0) { Write-Host "import check failed: exit code $code"; exit 1 }
          if ($text -match "ERROR:" -or $text -match "Parse Error" -or $text -match "SCRIPT ERROR") {
            Write-Host "import check failed: ERROR / Parse Error found in log"
            exit 1
          }
          Write-Host "import check passed"

      - name: 全量测试（tests/run_tests.gd）
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path artifacts\logs | Out-Null
          $stepLog = "artifacts\logs\tests-step.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run_tests.ps1 -Godot "$env:GODOT_BIN" -TimeoutSec 600 2>&1 | Tee-Object -FilePath $stepLog
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $meanings = @{ 1 = "test assertions failed"; 2 = "no RESULT line (tests did not run)"; 3 = "no ALL PASS line (crash/aborted)"; 4 = "SUITE_TOTAL expected != actual"; 5 = "engine exit code nonzero"; 6 = "engine or project missing"; 7 = "timeout"; 8 = "account not closed"; 9 = "account script did not run" }
            $meaning = $meanings[$code]
            if (-not $meaning) { $meaning = "unknown" }
            $asciiKey = (Get-Content $stepLog | Select-String -Pattern "^RESULT:|SUITE_TOTAL|VERDICT:" | Select-Object -Last 3 | ForEach-Object { $_.Line }) -join " | "
            Write-Host "::group::test failure summary (exit=$code)"
            Get-Content $stepLog | Select-String -Pattern "\[run_tests\] FAIL|RESULT:|SUITE_TOTAL|=== FAILED|^  FAIL " | Select-Object -Last 12 | ForEach-Object { Write-Host $_.Line }
            Write-Host "::endgroup::"
            Write-Host "::error::Full test suite failed (exit=$code, meaning: $meaning). ASCII key lines: $asciiKey"
            Write-Host "See uploaded artifact 'logs' -> tests-step.log / tests.log"
            exit $code
          }

      - name: 汇总日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: artifacts/logs/**
          if-no-files-found: ignore
